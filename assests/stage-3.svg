<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <style>
    .glow   { transform-origin: 200px 210px; animation: glow 3s ease-in-out infinite; }
    .sweep  { animation: sweep 3s ease-in-out infinite; }
    .sweep2 { animation: sweep 3s ease-in-out infinite; animation-delay: .12s; }
    .shimmer{ animation: shimmer 1.8s ease-in-out infinite; }
    .star   { transform-box: fill-box; transform-origin: center; animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: .5s; }
    .s3 { animation-delay: 1.1s; }
    .s4 { animation-delay: 1.7s; }
    .s5 { animation-delay: 2.2s; }
    .dust   { transform-box: fill-box; transform-origin: center; animation: dust 2.4s ease-in-out infinite; }
    .d2 { animation-delay: .6s; }
    .d3 { animation-delay: 1.2s; }
    .d4 { animation-delay: 1.8s; }

    @keyframes glow {
      0%, 100% { opacity: .45; transform: scale(.92); }
      50%      { opacity: .95; transform: scale(1.08); }
    }
    @keyframes sweep {
      0%        { transform: translateX(-90px); opacity: 0; }
      10%       { opacity: 1; }
      45%       { transform: translateX(140px); opacity: 1; }
      55%, 100% { transform: translateX(140px); opacity: 0; }
    }
    @keyframes shimmer {
      0%, 100% { opacity: .55; }
      50%      { opacity: 1; }
    }
    @keyframes twinkle {
      0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
      15%      { transform: scale(1.2) rotate(20deg); opacity: 1; }
      35%      { transform: scale(0) rotate(45deg); opacity: 0; }
    }
    @keyframes dust {
      0%, 100% { transform: translateY(6px) scale(.5); opacity: 0; }
      50%      { transform: translateY(-10px) scale(1); opacity: 1; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17133a"/>
      <stop offset="1" stop-color="#3b2a6e"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9ee0" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#7ab8ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7ab8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pinkL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd1f0"/>
      <stop offset=".5" stop-color="#ff7cc8"/>
      <stop offset="1" stop-color="#d63fa0"/>
    </linearGradient>
    <linearGradient id="blueR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4f0ff"/>
      <stop offset=".5" stop-color="#6fb4ff"/>
      <stop offset="1" stop-color="#3a6ee0"/>
    </linearGradient>
    <linearGradient id="blueL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4f0ff"/>
      <stop offset=".5" stop-color="#6fb4ff"/>
      <stop offset="1" stop-color="#3a6ee0"/>
    </linearGradient>
    <linearGradient id="pinkR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd1f0"/>
      <stop offset=".5" stop-color="#ff7cc8"/>
      <stop offset="1" stop-color="#d63fa0"/>
    </linearGradient>
    <linearGradient id="topF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#ffe3f6"/>
      <stop offset="1" stop-color="#bfe0ff"/>
    </linearGradient>
    <radialGradient id="rock" cx="40%" cy="25%" r="85%">
      <stop offset="0" stop-color="#b8b4c4"/>
      <stop offset=".6" stop-color="#7d7890"/>
      <stop offset="1" stop-color="#4b4760"/>
    </radialGradient>

    <!-- crystal with pink left / blue right -->
    <g id="crystalA">
      <polygon points="176,180 200,192 200,296 172,292" fill="url(#pinkL)"/>
      <polygon points="200,192 226,180 230,290 200,296" fill="url(#blueR)"/>
      <polygon class="shimmer" points="176,180 200,138 226,180 200,192" fill="url(#topF)"/>
      <polygon points="182,192 190,197 190,280 180,277" fill="#fff" opacity=".28"/>
      <g fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.5" stroke-linejoin="round">
        <polyline points="176,180 200,192 226,180"/>
        <line x1="200" y1="192" x2="200" y2="296"/>
        <polygon points="172,292 176,180 200,138 226,180 230,290 200,296"/>
      </g>
    </g>
    <!-- crystal with blue left / pink right -->
    <g id="crystalB">
      <polygon points="176,180 200,192 200,296 172,292" fill="url(#blueL)"/>
      <polygon points="200,192 226,180 230,290 200,296" fill="url(#pinkR)"/>
      <polygon class="shimmer" points="176,180 200,138 226,180 200,192" fill="url(#topF)"/>
      <polygon points="182,192 190,197 190,280 180,277" fill="#fff" opacity=".28"/>
      <g fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.5" stroke-linejoin="round">
        <polyline points="176,180 200,192 226,180"/>
        <line x1="200" y1="192" x2="200" y2="296"/>
        <polygon points="172,292 176,180 200,138 226,180 230,290 200,296"/>
      </g>
    </g>

    <clipPath id="mainClip">
      <polygon points="172,292 176,180 200,138 226,180 230,290 200,296"/>
    </clipPath>
    <path id="starShape" d="M0 -30 L4 -4 L30 0 L4 4 L0 30 L-4 4 L-30 0 L-4 -4 Z"/>
  </defs>

  <!-- backdrop -->
  <rect width="400" height="400" rx="28" fill="url(#bg)"/>
  <g fill="#fff" opacity=".7">
    <circle cx="48" cy="60" r="1.6"/><circle cx="330" cy="52" r="1.4"/>
    <circle cx="90" cy="150" r="1.2"/><circle cx="352" cy="170" r="1.8"/>
    <circle cx="30" cy="260" r="1.3"/><circle cx="372" cy="290" r="1.2"/>
    <circle cx="150" cy="40" r="1.2"/><circle cx="262" cy="86" r="1.5"/>
  </g>

  <!-- glow behind the crystals -->
  <circle class="glow" cx="200" cy="210" r="150" fill="url(#glowG)"/>

  <!-- small back crystals -->
  <use href="#crystalB" transform="translate(150 302) rotate(-32) scale(.6) translate(-200 -296)"/>
  <use href="#crystalA" transform="translate(256 306) rotate(28) scale(.5) translate(-200 -296)"/>
  <use href="#crystalB" transform="translate(224 312) rotate(58) scale(.3) translate(-200 -296)"/>

  <!-- main crystal with sweeping shine -->
  <g transform="rotate(-6 200 296)">
    <use href="#crystalA"/>
    <g clip-path="url(#mainClip)">
      <g class="sweep">
        <polygon points="150,120 176,120 156,310 130,310" fill="#fff" opacity=".75"/>
      </g>
      <g class="sweep2">
        <polygon points="184,120 192,120 172,310 164,310" fill="#fff" opacity=".6"/>
      </g>
    </g>
  </g>

  <!-- pebble -->
  <path d="M104 334 C94 300 146 282 200 286 C262 282 310 298 298 336 C292 362 232 372 196 372 C148 372 110 364 104 334 Z" fill="url(#rock)" stroke="#3a3650" stroke-width="3" stroke-linejoin="round"/>
  <path d="M130 304 C150 294 176 292 196 294" fill="none" stroke="#e1deea" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <g fill="#3a3650" opacity=".45">
    <circle cx="150" cy="340" r="3"/><circle cx="238" cy="348" r="3.5"/>
    <circle cx="270" cy="324" r="2.5"/><circle cx="180" cy="356" r="2.5"/>
    <circle cx="124" cy="326" r="2"/>
  </g>
  <path d="M214 304 L228 322 L222 340" fill="none" stroke="#3a3650" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>

  <!-- twinkling sparkle stars -->
  <g fill="#fff" stroke="#ffd6f4" stroke-width="1">
    <g transform="translate(196 134)"><use class="star" href="#starShape"/></g>
    <g transform="translate(240 176) scale(.7)"><use class="star s2" href="#starShape"/></g>
    <g transform="translate(160 196) scale(.6)"><use class="star s3" href="#starShape"/></g>
    <g transform="translate(120 244) scale(.8)"><use class="star s4" href="#starShape"/></g>
    <g transform="translate(284 248) scale(.55)"><use class="star s5" href="#starShape"/></g>
  </g>

  <!-- floating glitter -->
  <g fill="#ffe6f8">
    <circle class="dust" cx="170" cy="150" r="2.5"/>
    <circle class="dust d2" cx="238" cy="130" r="2"/>
    <circle class="dust d3" cx="262" cy="200" r="2.5"/>
    <circle class="dust d4" cx="138" cy="190" r="2"/>
  </g>
</svg>
